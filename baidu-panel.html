<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>百度网盘 · YouTube Digest</title><link rel="stylesheet" href="baidu-panel.css"><script src="subtitles.js" defer></script><script src="baidu-panel.js" defer></script></head>
<body><header><strong>YouTube Digest</strong><a href="options.html" target="_blank" rel="noopener">设置</a></header>
<main><p class="eyebrow">百度网盘学习助手 · 适配预览版</p><h1 id="title">请先播放网盘视频</h1><p id="connection" role="status">正在连接当前标签页…</p>
<div class="buttons"><button id="read">读取页面字幕</button><button id="import">导入 SRT / VTT</button><input id="file" type="file" accept=".srt,.vtt" hidden></div>
<p class="hint">请先在网盘播放器中开启字幕。无法读取或字幕在画面中时，请导入对应字幕文件。字幕与视频需使用相同时间轴。</p>
<p id="status" role="status" aria-live="polite"></p>
<section><h2>字幕 <span id="count"></span></h2><div class="buttons"><button id="translate">翻译所选字幕</button><button id="explain">解释所选字幕</button><button id="analyze">生成摘要</button></div><p class="hint">点击字幕文字选择，点击时间跳转。AI 操作会把相关字幕发送给设置中的服务；不需要 Supadata。</p><div id="captions"></div></section>
<section><h2>AI 结果</h2><div id="result">导入字幕后，可生成摘要或解释。</div></section>
<section><h2>时间戳笔记</h2><label for="note">记录你的想法</label><textarea id="note" rows="3" maxlength="5000" placeholder="笔记仅保存在当前 Chrome 个人资料中"></textarea><button id="save">保存当前时间的笔记</button><div id="notes"></div></section>
</main></body></html>
